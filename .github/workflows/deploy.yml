# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # ручной запуск через UI GitHub

permissions:
  contents: read
  pages: write
  id-token: write # требуется для OIDC-аутентификации деплоя в Pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Active LTS (поддержка до 04.2026)
          cache: "npm"       # 🚀 кэширует node_modules между запусками

      - name: Install & Run Checks
        run: |
          npm ci
          npm run lint
          npm run test       # убери строку, если тестов пока нет

      - name: Prepare static build
        run: |
          mkdir -p dist
          cp src/index.html dist/
          cp src/style.css dist/
          cp src/script.js dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4