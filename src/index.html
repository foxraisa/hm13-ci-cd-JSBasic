<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление параграфов</title>
</head>
<body>
    <div class="container">
        <h1>📝 Добавление параграфов</h1>
       
        <div class="input-group">
            <input type="text" id="textInput" placeholder="Введите текст...">
            <button id="addButton" disabled>Добавить параграф</button>
        </div>
       
        <!-- Блок для сообщений об ошибках -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>
       
        <div class="paragraphs-container" id="paragraphsContainer">
            <p>Первый параграф страницы</p>
            <p>Второй параграф с примером текста</p>
            <p>Третий параграф для демонстрации</p>
        </div>
       
        <div class="counter">
            Параграфов: <span id="counter">3</span>
            <div class="limit-info">(максимум 5)</div>
        </div>
    </div>

    <!-- Webpack сам добавит script.js -->
</body>
</html>
